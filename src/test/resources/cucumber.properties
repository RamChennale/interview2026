# =========================================================
# Cucumber project-wide defaults (TestNG/JUnit4-style runner)
# =========================================================
# This is a DEFAULT. It is overridden by -Dcucumber.filter.tags=... passed on the
# Maven/Jenkins command line (forwarded via Surefire's systemPropertyVariables, see pom.xml).
# Values set directly on @CucumberOptions would take precedence over this file, which is
# why "tags" is intentionally left out of the @CucumberOptions annotation on TestRunner.

cucumber.filter.tags=@regression
cucumber.execution.order=lexical
